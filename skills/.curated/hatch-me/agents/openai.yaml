interface:
  display_name: "Hatch Me"
  short_description: "Hatch the user as a Codex baby from their date of birth, with the accurate moon phase of the day baked in."
  default_prompt: "Ask the user for their date of birth (YYYY-MM-DD); time and timezone are optional but improve accuracy. Then run `python3 ${CODEX_HOME:-$HOME/.codex}/skills/hatch-me/scripts/hatch.py --dob <dob> [--tz ±HH:MM]` (use python3, not python — macOS default). The script computes the lunar phase at the moment of birth via Meeus AA2 Ch. 47/48/49, derives a deterministic Soul (name, species, vibe, Bones stats, personality seed) seeded by BLAKE2b(salt|dob_utc|phase_name|illumination), persists to ${CODEX_HOME:-$HOME/.codex}/memories/babies/<name>/baby.json (under memories/ so codex's workspace-write sandbox always permits the write), and prints the birth card with moon glyph + zodiac. Then read references/baby-roleplay.md and roleplay as the freshly-hatched baby for the rest of the turn, using the persisted personality. Subsequent sessions can re-invoke this same baby with `--name <name>`."
